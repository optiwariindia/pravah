<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravah Playground</title>
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
        body { margin: 0; background: #edf3f5; color: #17313a; }
        main { max-width: 960px; margin: 0 auto; padding: 28px 20px; }
        h1 { margin-bottom: 6px; }
        .muted { color: #5d7178; }
        .panel { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 8px 28px #17313a14; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
        label { display: grid; gap: 6px; font-size: 13px; font-weight: 650; }
        input { border: 1px solid #b8c8ce; border-radius: 7px; padding: 10px; font: inherit; }
        input[type="text"] { min-width: 0; }
        .token { grid-column: 1 / -1; }
        button { border: 0; border-radius: 7px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
        .primary { color: white; background: #087f8c; }
        .secondary { color: #17313a; background: #dce9ec; }
        .actions { display: flex; gap: 10px; margin-top: 14px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat { background: #f5f9fa; padding: 14px; border-radius: 8px; }
        .stat strong { display: block; margin-top: 4px; }
        #log { height: 360px; overflow: auto; background: #102a33; color: #dff7f8; border-radius: 8px; padding: 14px; font: 13px/1.45 ui-monospace, monospace; }
        .entry { border-bottom: 1px solid #31515a; padding: 7px 0; white-space: pre-wrap; }
        .connected { color: #087f5b; }
        .disconnected { color: #b42318; }
        @media (max-width: 680px) {
            .grid, .stats { grid-template-columns: 1fr; }
            .token { grid-column: auto; }
        }
    </style>
</head>
<body>
<main>
    <h1>Pravah Playground</h1>
    <p class="muted">Paste a short-lived subscription token issued by your application backend. Do not paste API or admin keys.</p>

    <section class="panel">
        <div class="grid">
            <label>
                Base URL
                <input id="base-url" type="text" value="">
            </label>
            <label>
                Streams (comma-separated)
                <input id="streams" type="text" value="global">
            </label>
            <label class="token">
                Subscription token
                <input id="token" type="password" autocomplete="off" placeholder="eyJ...">
            </label>
        </div>
        <div class="actions">
            <button id="connect" class="primary">Connect</button>
            <button id="disconnect" class="secondary" disabled>Close</button>
        </div>
    </section>

    <section class="panel">
        <div class="stats">
            <div class="stat">Connection<strong id="state" class="disconnected">closed</strong></div>
            <div class="stat">Leader tab<strong id="leader">no</strong></div>
            <div class="stat">Active streams<strong id="active-streams">none</strong></div>
        </div>
    </section>

    <section class="panel">
        <div id="log"><div class="entry">Waiting for a connection...</div></div>
    </section>
</main>

<script src="/js/pravah-sdk.js"></script>
<script>
    const baseUrl = document.querySelector('#base-url');
    const streams = document.querySelector('#streams');
    const token = document.querySelector('#token');
    const connect = document.querySelector('#connect');
    const disconnect = document.querySelector('#disconnect');
    const state = document.querySelector('#state');
    const leader = document.querySelector('#leader');
    const activeStreams = document.querySelector('#active-streams');
    const log = document.querySelector('#log');
    let client = null;

    baseUrl.value = window.location.origin;

    function appendLog(message, value) {
        const entry = document.createElement('div');
        entry.className = 'entry';
        const suffix = value === undefined ? '' : `\n${JSON.stringify(value, null, 2)}`;
        entry.textContent = `[${new Date().toISOString()}] ${message}${suffix}`;
        log.prepend(entry);
    }

    function updateState() {
        const value = client?.connectionState || 'closed';
        state.textContent = value;
        state.className = value === 'connected' ? 'connected' : 'disconnected';
        leader.textContent = client?.isLeader ? 'yes' : 'no';
    }

    connect.addEventListener('click', () => {
        client?.close();
        const selectedStreams = streams.value.split(',').map(item => item.trim()).filter(Boolean);
        if (!selectedStreams.length || !token.value.trim()) {
            appendLog('Provide at least one stream and a subscription token.');
            return;
        }

        client = new Pravah({
            baseUrl: baseUrl.value.trim().replace(/\/$/, ''),
            streams: selectedStreams,
            subscriptionToken: token.value.trim()
        });
        client.on('statechange', (nextState) => {
            updateState();
            appendLog(`State changed: ${nextState}`);
        });
        client.on('signal', (data) => appendLog('Signal', data));
        client.on('connected', data => appendLog('Connected', data));
        client.on('heartbeat', data => appendLog('Heartbeat', data));
        client.on('error', error => appendLog('Error', { message: error.message }));

        activeStreams.textContent = selectedStreams.join(', ');
        disconnect.disabled = false;
        updateState();
    });

    disconnect.addEventListener('click', () => {
        client?.close();
        disconnect.disabled = true;
        activeStreams.textContent = 'none';
        updateState();
        appendLog('Client closed.');
    });
</script>
</body>
</html>
