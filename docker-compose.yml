services:
  pravah-legacy:
    profiles:
      - legacy
    image: optiwariindia/pravah:0.0.1
    build:
      target: development
      context: ./pravah
    restart: unless-stopped
    environment:
      - PORT=3000
      - MONGODB=mongodb://db/pravah
    volumes:
      - ./pravah:/pravah
      - /pravah/node_modules
  pravah-go:
    image: optiwariindia/pravah-go:1.0.0
    build:
      context: ./pravah-go
    restart: unless-stopped
    environment:
      - PORT=3000
      - MONGODB=mongodb://db/pravah
      - EVENT_RETENTION_HOURS=24
      - SSE_HEARTBEAT_INTERVAL_SECONDS=${SSE_HEARTBEAT_INTERVAL_SECONDS:-30}
      - CLIENT_SIGNAL_BUFFER=${CLIENT_SIGNAL_BUFFER:-64}
      - MAX_SUBSCRIPTION_STREAMS=${MAX_SUBSCRIPTION_STREAMS:-32}
      - MAX_REPLAY_EVENTS=${MAX_REPLAY_EVENTS:-1000}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-16384}
      - DATABASE_OPERATION_TIMEOUT_SECONDS=${DATABASE_OPERATION_TIMEOUT_SECONDS:-3}
      - SUBSCRIPTION_JWT_SECRET=${SUBSCRIPTION_JWT_SECRET:?Set a 32+ character subscription signing secret}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?Set a 32+ character admin API key}
    depends_on:
      - db

  db:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - ./db:/data/db